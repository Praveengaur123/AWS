<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body class="bg-light text-dark" >
    <h4 style="color: rgb(50, 94, 223);">Enter The User Name and Password for Login</h4>
    <form  id="login" method="post" class="form-control mb-3 border rounded">
        
        <input type="email" name="" id="loginEmail" placeholder="Enter Your Email">
        
        <input type="password" name="" id="loginPassword" placeholder="Enter Your Password">

        <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
    </form>
    <div style="margin-left: 2ch;">
    <button type="submit" id="forgot-password-btn" class="btn-secondary">Forgot Password</button>
    <button  ><a href="/signup" id="signupPage">New User - SignUp Now</a></button>
    </div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="login.js"></script>
</html>
