<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body class="bg-light text-dark">
    <div class="container py-5 mb-3">
        <h4 style="color:  rgb(50, 94, 223)">Enter Your Details To Create The User Account</h4>
    <form  id="sign-up" method="post" class="border p-4 bg-white rounded shadow-sm" >
        <label for="Name">Enter Your Name</label>   
        <input type="text" id="username" placeholder="Enter Your Name" required>
        <label for="Email">Enter Your Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Your Email" required>
        <label for="Password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter Your Password" >

        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
    <h5>Existing User <a href="/login" id="loginPage">Click Here For Login</a></h5>
    
</div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="signup.js"></script>
</html>
